    <link rel="apple-touch-icon" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6924840d3628eabd1d7f8247/a8bebf810_Untitleddesign.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <title>ThriveNut</title>
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #1a1a2e; transition: opacity 0.3s ease;
      }
      #app-splash img { width: 64px; height: 64px; margin-bottom: 16px; animation: pulse 1.5s ease-in-out infinite; }
      #app-splash p { color: #1fd2ea; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>

    <div id="root"></div>
    <div id="app-splash">
      <img src="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6924840d3628eabd1d7f8247/e225113d4_Untitleddesign.png" alt="ThriveNut" />
      <p>Let's Thrive!</p>
    </div>
